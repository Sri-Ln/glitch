name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code@2.1.300
      - run: claude plugin validate .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        plugin: [glitch-core, glitch-hud, glitch-pets]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.plugin }}, ${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code@2.1.300
      - run: claude plugin test plugins/${{ matrix.plugin }}
